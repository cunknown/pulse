<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--muted:#86868b;--line:#e8e8ed;--accent:#0071e3;--accent-soft:rgba(0,113,227,.1);--good:#1d9b4a;--bad:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#2c2c2e;--accent:#2997ff;--accent-soft:rgba(41,151,255,.15);--good:#30d158;--bad:#ff453a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:20px 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:36px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.acct select{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px}
h1{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 28px;font-size:17px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.panel{background:var(--surface);border-radius:20px;overflow:hidden;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:22px 24px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .l{font-size:13px;color:var(--muted);display:block}
.stat .v{font-size:30px;font-weight:600;letter-spacing:-.03em;display:block}
.chart{padding:24px}
.chart h2{font-size:15px;font-weight:600;margin:0 0 8px}
svg{display:block;width:100%;height:auto}
h2.sec{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:36px 0 14px}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;object-fit:cover;background:var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:var(--line)}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t span,.n small{color:var(--muted);font-size:13px}
.n{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.n b{font-weight:600;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.post{background:var(--surface);border-radius:18px;overflow:hidden;display:block;color:inherit;text-decoration:none}
.post img,.post .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line)}
.post .meta{padding:10px 14px 12px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;padding:8px 18px;border-radius:980px;font-weight:500;font-size:14px;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.link{color:var(--accent);font-size:13px;font-weight:500;text-decoration:none}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:980px;white-space:nowrap}
.b-scheduled{background:var(--accent-soft);color:var(--accent)}
.b-publishing{background:var(--line);color:var(--muted)}
.b-published{background:rgba(48,209,88,.15);color:var(--good)}
.b-failed{background:rgba(255,69,58,.15);color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 16px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:980px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.view{display:none}.view.on{display:block}
dialog{border:0;border-radius:22px;padding:0;background:var(--surface);color:var(--text);width:min(460px,calc(100% - 32px));max-height:calc(100% - 32px);box-shadow:0 24px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:14px}
dialog h3{margin:0;font-size:20px;letter-spacing:-.02em}
dialog textarea,dialog input:not([type=checkbox]),dialog select{width:100%;background:var(--bg);border:0;border-radius:12px;padding:11px 14px}
dialog textarea{resize:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.pickhead select{width:auto;padding:7px 12px}
.picker{max-height:170px;overflow:auto;background:var(--bg);border-radius:12px;padding:6px}
.picker label{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.acts{display:flex;justify-content:flex-end;gap:8px}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 0}
@media (max-width:720px){h1{font-size:32px}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.wrap{padding:16px 16px 48px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Pulse</span>
    <div class="seg" id="nav">
      <button aria-pressed="true" data-v="overview">Overview</button>
      <button aria-pressed="false" data-v="schedule">Schedule</button>
      <button aria-pressed="false" data-v="accounts">Accounts</button>
    </div>
    <label class="acct"><select id="acct" aria-label="Account"></select></label>
  </header>

  <section class="view on" id="overview"></section>

  <section class="view" id="schedule">
    <h1>Schedule</h1>
    <p class="sub">Posts publish automatically at the time you set.</p>
    <div class="bar">
      <div class="seg" id="filter">
        <button aria-pressed="true" data-f="upcoming">Upcoming</button>
        <button aria-pressed="false" data-f="published">Published</button>
        <button aria-pressed="false" data-f="failed">Failed</button>
      </div>
      <button class="btn" id="new">New post</button>
    </div>
    <div class="panel" id="plist"></div>
  </section>

  <section class="view" id="accounts">
    <h1>Accounts</h1>
    <p class="sub">Instagram accounts connected to Pulse.</p>
    <div class="bar"><span></span><a class="btn" href="/auth/instagram">Connect account</a></div>
    <div class="panel" id="alist"></div>
  </section>
</div>

<dialog id="dlg">
  <form id="form">
    <h3>New post</h3>
    <textarea id="cap" rows="4" placeholder="Write a caption" maxlength="2200"></textarea>
    <div class="pickhead"><span id="pcount">0 selected</span><button type="button" class="link" id="pall">Select all</button></div>
    <div class="picker" id="picker"></div>
    <input type="file" id="file" accept="image/jpeg,video/mp4,video/quicktime" aria-label="Photo or video">
    <p class="hint">JPEG photo or MP4 video. Or paste a public link:</p>
    <div class="two"><input id="murl" placeholder="https://…" aria-label="Media link"><select id="mtype" aria-label="Type"><option value="IMAGE">Photo</option><option value="REELS">Reel</option></select></div>
    <div class="two"><select id="when" aria-label="When"><option value="later">Schedule for</option><option value="now">Publish now</option></select><input type="datetime-local" id="dt" aria-label="Date and time"></div>
    <label class="pickhead">Stagger across accounts<select id="stag"><option value="0">Same time</option><option value="5">5 min apart</option><option value="15">15 min apart</option><option value="30">30 min apart</option></select></label>
    <div class="err" id="err"></div>
    <div class="acts"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" id="go">Schedule</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null?'–':n>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':Number(n).toLocaleString('en');
const when=d=>new Date(d).toLocaleString('en',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3500)}
const S={accts:[],posts:[],acct:'all',filter:'upcoming',view:'overview',ov:{}};

function show(v){S.view=v;document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));render()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
$('#filter').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.filter=b.dataset.f;document.querySelectorAll('#filter button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderSchedule()};
$('#acct').onchange=()=>{S.acct=$('#acct').value;render()};

async function load(){
  [S.accts,S.posts]=await Promise.all([api('/api/accounts'),api('/api/posts')]);
  const sel=$('#acct');sel.innerHTML='<option value="all">All accounts</option>'+S.accts.map(a=>`<option value="${a.id}">@${esc(a.username)}</option>`).join('');
  if(!S.accts.some(a=>a.id===S.acct))S.acct='all';sel.value=S.acct;render();
}
function render(){renderOverview();renderSchedule();renderAccounts()}

function emptyConnect(){return `<div class="panel empty"><p>Connect an Instagram account to get started.</p><a class="btn" href="/auth/instagram">Connect Instagram</a></div>`}

async function renderOverview(){
  const el=$('#overview');
  if(!S.accts.length){el.innerHTML='<h1>Overview</h1><p class="sub">Welcome to Pulse.</p>'+emptyConnect();return}
  if(S.acct==='all'){
    const week=Date.now()-7*864e5,pub=S.posts.filter(p=>p.status==='published'&&new Date(p.published_at)>week).length;
    el.innerHTML=`<h1>Overview</h1><p class="sub">All ${S.accts.length} accounts</p>
    <div class="panel stats"><div class="stat"><span class="l">Accounts</span><span class="v">${S.accts.length}</span></div><div class="stat"><span class="l">Followers</span><span class="v">${fmt(S.accts.reduce((s,a)=>s+(a.followers||0),0))}</span></div><div class="stat"><span class="l">Scheduled</span><span class="v">${S.accts.reduce((s,a)=>s+a.scheduled,0)}</span></div><div class="stat"><span class="l">Published, 7 days</span><span class="v">${pub}</span></div></div>
    <div class="panel">${S.accts.map(a=>`<button class="row" data-id="${a.id}">${av(a)}<div class="t"><b>@${esc(a.username)}</b><span>${a.status==='active'?'Connected':'Needs reconnecting'}</span></div><div class="n"><b>${fmt(a.followers)}</b><small>followers</small></div></button>`).join('')}</div>`;
    el.querySelectorAll('.row').forEach(b=>b.onclick=()=>{S.acct=b.dataset.id;$('#acct').value=S.acct;render()});return;
  }
  const a=S.accts.find(x=>x.id===S.acct);
  el.innerHTML=`<h1>@${esc(a.username)}</h1><p class="sub">Loading from Instagram…</p>`;
  let d=S.ov[a.id];
  try{if(!d||Date.now()-d.t>60000){d={...await api(`/api/accounts/${a.id}/overview`),t:Date.now()};S.ov[a.id]=d}}
  catch(e){el.innerHTML=`<h1>@${esc(a.username)}</h1><p class="sub err">${esc(e.message)}</p>`;return}
  if(S.acct!==a.id||S.view!=='overview')return;
  const m=d.media,avg=k=>m.length?Math.round(m.reduce((s,x)=>s+(x[k]||0),0)/m.length):0;
  el.innerHTML=`<h1>@${esc(a.username)}</h1><p class="sub">${esc(d.profile.account_type||'')} account</p>
  <div class="panel stats"><div class="stat"><span class="l">Followers</span><span class="v">${fmt(d.profile.followers_count)}</span></div><div class="stat"><span class="l">Posts</span><span class="v">${fmt(d.profile.media_count)}</span></div><div class="stat"><span class="l">Avg likes</span><span class="v">${fmt(avg('like_count'))}</span></div><div class="stat"><span class="l">Avg comments</span><span class="v">${fmt(avg('comments_count'))}</span></div></div>
  <div class="panel chart"><h2>Followers</h2>${chart(d.snapshots)}</div>
  <h2 class="sec">Recent posts</h2>
  <div class="grid">${m.map(x=>`<a class="post" href="${esc(x.permalink)}" target="_blank" rel="noopener">${(x.media_type==='VIDEO'?x.thumbnail_url:x.media_url)?`<img src="${esc(x.media_type==='VIDEO'?x.thumbnail_url:x.media_url)}" alt="" loading="lazy">`:'<div class="ph"></div>'}<div class="meta"><span>${fmt(x.like_count)} likes</span><span>${fmt(x.comments_count)} comments</span></div></a>`).join('')||'<p class="sub">No posts yet.</p>'}</div>`;
}
function chart(s){
  if(s.length<2)return '<p class="sub" style="margin:0;font-size:14px">History starts today. Pulse saves follower counts daily, so the line appears tomorrow.</p>';
  const W=860,H=200,v=s.map(x=>x.followers),mn=Math.min(...v),mx=Math.max(...v),sp=(mx-mn)||1;
  const pts=v.map((y,i)=>[i*W/(v.length-1),10+(H-30)*(1-(y-mn)/sp)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${line} L${W},${H} L0,${H} Z" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const av=a=>a.profile_picture_url?`<img class="avatar" src="${esc(a.profile_picture_url)}" alt="">`:'<div class="avatar"></div>';

function renderSchedule(){
  let l=S.posts.filter(p=>S.acct==='all'||p.account_id===S.acct);
  const f=S.filter;
  l=l.filter(p=>f==='upcoming'?['scheduled','publishing'].includes(p.status):p.status===f);
  l.sort((a,b)=>f==='upcoming'?new Date(a.scheduled_at)-new Date(b.scheduled_at):new Date(b.scheduled_at)-new Date(a.scheduled_at));
  $('#plist').innerHTML=l.length?l.map(p=>`<div class="row">${p.media_type==='REELS'?`<video class="thumb" src="${esc(p.media_url)}#t=0.1" muted preload="metadata"></video>`:`<img class="thumb" src="${esc(p.media_url)}" alt="">`}
    <div class="t"><b>${esc(p.caption)||'No caption'}</b><span>@${esc(p.username)}, ${when(p.status==='published'?p.published_at:p.scheduled_at)}</span>${p.last_error?`<br><span class="err">${esc(p.last_error)}</span>`:''}</div>
    <span class="badge b-${p.status}">${{scheduled:'Scheduled',publishing:'Publishing…',published:'Published',failed:'Failed'}[p.status]}</span>
    ${p.permalink?`<a class="link" href="${esc(p.permalink)}" target="_blank" rel="noopener">View</a>`:''}
    ${p.status==='failed'?`<button class="link" data-retry="${p.id}">Retry</button>`:''}
    ${['scheduled','failed'].includes(p.status)?`<button class="link" style="color:var(--muted)" data-del="${p.id}">Remove</button>`:''}</div>`).join(''):`<div class="empty"><p>${f==='upcoming'?'Nothing scheduled.':'Nothing here yet.'}</p>${f==='upcoming'&&S.accts.length?'':''}</div>`;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{try{await api('/api/posts/'+b.dataset.del,{method:'DELETE'});await load()}catch(e){toast(e.message)}});
  document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{try{await api(`/api/posts/${b.dataset.retry}/retry`,{method:'POST'});toast('Retrying');await load()}catch(e){toast(e.message)}});
}

function renderAccounts(){
  $('#alist').innerHTML=S.accts.length?S.accts.map(a=>{
    const days=Math.round((new Date(a.token_expires_at)-Date.now())/864e5),ok=a.status==='active';
    return `<div class="row">${av(a)}<div class="t"><b>@${esc(a.username)}</b><span ${ok?'':'style="color:var(--bad)"'}>${ok?'Connected, renews automatically':'Connection expired. Reconnect to keep posting.'}</span></div><div class="n"><b>${fmt(a.followers)}</b><small>${a.scheduled} scheduled</small></div>${ok?'':'<a class="link" href="/auth/instagram">Reconnect</a>'}<button class="link" style="color:var(--muted)" data-rm="${a.id}" data-n="${esc(a.username)}">Remove</button></div>`}).join(''):emptyConnect();
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(!confirm(`Remove @${b.dataset.n}? Its scheduled posts will be deleted.`))return;try{await api('/api/accounts/'+b.dataset.rm,{method:'DELETE'});await load()}catch(e){toast(e.message)}});
}

// ---- New post ----
const pcount=()=>{$('#pcount').textContent=document.querySelectorAll('#picker input:checked').length+' selected'};
$('#new').onclick=()=>{
  const ok=S.accts.filter(a=>a.status==='active');
  if(!ok.length){toast('Connect an account first');show('accounts');return}
  $('#form').reset();$('#err').textContent='';
  $('#picker').innerHTML=ok.map(a=>`<label><input type="checkbox" value="${a.id}" ${S.acct===a.id?'checked':''}>@${esc(a.username)}</label>`).join('');
  if(ok.length===1)$('#picker input').checked=true;
  $('#picker').onchange=pcount;pcount();$('#pall').textContent='Select all';
  const d=new Date(Date.now()+36e5);d.setMinutes(0,0,0);$('#dt').value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  $('#dlg').showModal();
};
$('#pall').onclick=()=>{const all=$('#pall').textContent==='Select all';document.querySelectorAll('#picker input').forEach(c=>c.checked=all);$('#pall').textContent=all?'Clear':'Select all';pcount()};
$('#cancel').onclick=()=>$('#dlg').close();
$('#when').onchange=()=>{$('#dt').disabled=$('#when').value==='now';$('#go').textContent=$('#when').value==='now'?'Publish now':'Schedule'};
$('#murl').oninput=()=>{$('#mtype').value=/\.(mp4|mov)(\?|$)/i.test($('#murl').value)?'REELS':'IMAGE'};
$('#form').onsubmit=async e=>{
  e.preventDefault();const err=$('#err'),btn=$('#go'),label=btn.textContent;err.textContent='';
  const ids=[...document.querySelectorAll('#picker input:checked')].map(i=>i.value);
  if(!ids.length){err.textContent='Select at least one account';return}
  const now=$('#when').value==='now';
  if(!now&&!$('#dt').value){err.textContent='Pick a date and time';return}
  btn.disabled=true;btn.textContent='Working…';
  try{
    let url=$('#murl').value.trim(),type=$('#mtype').value;const f=$('#file').files[0];
    if(f){btn.textContent='Uploading…';const fd=new FormData();fd.append('file',f);const r=await fetch('/api/upload',{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Upload failed');url=j.url;type=j.media_type}
    if(!url)throw new Error('Add a photo or video');
    await api('/api/posts',{method:'POST',body:JSON.stringify({account_ids:ids,caption:$('#cap').value,media_url:url,media_type:type,scheduled_at:now?null:new Date($('#dt').value).toISOString(),stagger_minutes:+$('#stag').value})});
    $('#dlg').close();toast(now?'Publishing now…':'Scheduled');S.filter='upcoming';document.querySelectorAll('#filter button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f==='upcoming'));await load();
  }catch(x){err.textContent=x.message}finally{btn.disabled=false;btn.textContent=label}
};

// ---- Boot ----
const q=new URLSearchParams(location.search);
if(q.get('connected'))toast('Connected @'+q.get('connected'));
if(q.get('error'))toast(q.get('error'));
if(q.has('connected')||q.has('error'))history.replaceState(null,'','/');
load().then(()=>{if(q.get('connected'))show('accounts')}).catch(e=>toast(e.message));
setInterval(()=>{if(S.view==='schedule'&&!$('#dlg').open)load().catch(()=>{})},15000);
</script>
</body>
</html>
